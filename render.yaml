services:
  - type: web
    name: eduquery-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: PYTHONPATH=. uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: QDRANT_URL
        value: https://d4eb2d26-4bb0-48ee-9698-a8678d193d8d.sa-east-1-0.aws.cloud.qdrant.io:6333
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: eduquery
      - key: GROQ_API_KEY
        sync: false
      - key: MYSQL_URL
        sync: false